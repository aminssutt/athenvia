x-app-build: &app-build
  context: .
  dockerfile: Dockerfile
  args:
    NEXT_PUBLIC_APP_URL: ${APP_URL:?APP_URL is required}
    NEXT_PUBLIC_ATHENVIA_DEPLOYMENT_ID: ${ATHENVIA_IMAGE_TAG:-docker}

x-database-environment: &database-environment
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}

x-app-environment: &app-environment
  <<: *database-environment
  ATHENVIA_IMAGE_TAG: ${ATHENVIA_IMAGE_TAG:-latest}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:?REDIS_PASSWORD is required}",
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli --no-auth-warning ping']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  migrate:
    image: athenvia-migrate:${ATHENVIA_IMAGE_TAG:-latest}
    build:
      <<: *app-build
      target: migrate
    restart: "no"
    environment:
      <<: *database-environment
    command:
      [
        "sh",
        "-c",
        "./packages/database/node_modules/.bin/prisma migrate deploy --schema=packages/database/prisma/schema.prisma && ./packages/database/node_modules/.bin/tsx packages/database/src/seed.ts",
      ]
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  web:
    image: athenvia-web:${ATHENVIA_IMAGE_TAG:-latest}
    build:
      <<: *app-build
      target: web
    restart: unless-stopped
    environment:
      <<: *app-environment
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXTAUTH_URL: ${APP_URL:?APP_URL is required}
      NEXT_PUBLIC_APP_URL: ${APP_URL:?APP_URL is required}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:?AUTH_EMAIL_FROM is required}
      AUTH_EMAIL_SERVER: ${AUTH_EMAIL_SERVER:-}
      AUTH_RESEND_API_KEY: ${AUTH_RESEND_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ATHENVIA_ADMIN_EMAILS: ${ATHENVIA_ADMIN_EMAILS:?ATHENVIA_ADMIN_EMAILS is required}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?VAPID_PUBLIC_KEY is required}
      SEARCH_RATE_LIMIT_SALT: ${SEARCH_RATE_LIMIT_SALT:-}
      PROGRAM_SUBMISSION_RATE_LIMIT_SALT: ${PROGRAM_SUBMISSION_RATE_LIMIT_SALT:-}
      UNIVERSITY_SUBMISSION_RATE_LIMIT_SALT: ${UNIVERSITY_SUBMISSION_RATE_LIMIT_SALT:-}
      PUSH_SUBSCRIPTION_RATE_LIMIT_SALT: ${PUSH_SUBSCRIPTION_RATE_LIMIT_SALT:-}
    expose:
      - "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  worker:
    image: athenvia-worker:${ATHENVIA_IMAGE_TAG:-latest}
    build:
      <<: *app-build
      target: worker
    restart: unless-stopped
    environment:
      <<: *app-environment
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?VAPID_PUBLIC_KEY is required}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?VAPID_PRIVATE_KEY is required}
      VAPID_SUBJECT: ${VAPID_SUBJECT:?VAPID_SUBJECT is required}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    stop_grace_period: 45s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

volumes:
  postgres_data:
  redis_data:

networks:
  backend:
    driver: bridge
