name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: athenvia
          POSTGRES_USER: athenvia
          POSTGRES_PASSWORD: athenvia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U athenvia -d athenvia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://athenvia:athenvia@localhost:5432/athenvia
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:validate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @athenvia/web exec playwright install --with-deps webkit
      - run: pnpm --filter @athenvia/web test:e2e

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example -f docker-compose.prod.yml config --quiet
      - run: >-
          docker build
          --build-arg NEXT_PUBLIC_APP_URL=http://localhost:3000
          --build-arg NEXT_PUBLIC_ATHENVIA_DEPLOYMENT_ID=ci
          --target web
          --tag athenvia-web:ci
          .
      - run: >-
          docker build
          --build-arg NEXT_PUBLIC_APP_URL=http://localhost:3000
          --build-arg NEXT_PUBLIC_ATHENVIA_DEPLOYMENT_ID=ci
          --target worker
          --tag athenvia-worker:ci
          .
      - run: >-
          docker build
          --build-arg NEXT_PUBLIC_APP_URL=http://localhost:3000
          --build-arg NEXT_PUBLIC_ATHENVIA_DEPLOYMENT_ID=ci
          --target migrate
          --tag athenvia-migrate:ci
          .
